[package]
name = "stuttgart-desktop"
version = "0.1.0"
description = "Stuttgart desktop app"
edition = "2021"

[lib]
name = "stuttgart_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
