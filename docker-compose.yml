services:
  postgres:
    image: postgres:17
    container_name: stuttgart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stuttgart
      POSTGRES_PASSWORD: stuttgart
      POSTGRES_DB: stuttgart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stuttgart -d stuttgart" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
